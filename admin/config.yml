backend:
  name: github
  repo: juvi2601/bs-rohrbach-erasmus
  branch: main
  base_url: https://REPLACE-WITH-CMS-AUTH-WORKER.workers.dev
locale: de
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://bs-rohrbach-erasmus.workers.dev
display_url: https://bs-rohrbach-erasmus.workers.dev
logo_url: /images/hero.jpg
collections:
- name: site
  label: Startseite & allgemeine Inhalte
  files:
  - name: site
    label: Alle Seitentexte & Bilder
    file: content/site.json
    format: json
    fields:
    - label: Browser & Grunddaten
      name: meta
      widget: object
      fields:
      - label: Seitentitel im Browser
        name: pageTitle
        widget: string
      - label: Beschreibung für Suchmaschinen
        name: description
        widget: text
    - label: Reisetitel
      name: tripTitle
      widget: string
    - label: Schule/Portalname
      name: school
      widget: string
    - label: Unterzeile im Kopf
      name: brandSubtitle
      widget: string
    - label: Untertitel im Titelbild
      name: subtitle
      widget: text
    - label: Abfahrt
      name: departure
      widget: datetime
    - label: Rückkehr
      name: returnDate
      widget: datetime
    - label: Großes Titelbild
      name: hero
      widget: image
    - label: Kleine Zeile über Titel
      name: heroEyebrow
      widget: string
    - label: Großer Titel
      name: heroTitle
      widget: string
    - label: Button Reiseprogramm
      name: heroPrimaryButton
      widget: string
    - label: Button Reisegruppe
      name: heroSecondaryButton
      widget: string
    - label: Countdown-Überschrift
      name: countdownLabel
      widget: string
    - label: Countdown-Datum als Text
      name: countdownDateText
      widget: string
    - label: Navigation
      name: navigation
      widget: list
      fields:
      - label: Beschriftung
        name: label
        widget: string
      - label: 'Ziel (z. B. #programm)'
        name: target
        widget: string
      - label: Hervorheben
        name: highlight
        widget: boolean
        required: false
        default: false
      - label: Als Hilfe-/Notfalllink kennzeichnen
        name: emergency
        widget: boolean
        required: false
        default: false
    - label: Schnellzugriffe
      name: quickLinks
      widget: list
      fields:
      - label: Icon/Emoji
        name: icon
        widget: string
      - label: Titel
        name: title
        widget: string
      - label: Untertitel
        name: subtitle
        widget: string
      - label: Ziel
        name: target
        widget: string
    - label: Heute-Bereich
      name: today
      widget: object
      fields:
      - label: Kleine Überschrift
        name: eyebrow
        widget: string
      - label: Titel vor Reisebeginn
        name: beforeTitle
        widget: string
      - label: Text vor Reisebeginn
        name: beforeText
        widget: text
      - label: Status vor Reisebeginn
        name: beforeLabel
        widget: string
      - label: Datumsbereich
        name: dateRange
        widget: string
      - label: Titel nach Reiseende
        name: afterTitle
        widget: string
      - label: Text nach Reiseende
        name: afterText
        widget: text
      - label: Status nach Reiseende
        name: afterLabel
        widget: string
    - label: Bereichsüberschriften
      name: sections
      widget: object
      fields:
      - label: News
        name: news
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: Programm
        name: program
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: Karte
        name: map
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: Wetter
        name: weather
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: Galerie
        name: gallery
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: Genuss
        name: culinary
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
      - label: Downloads
        name: downloads
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
        - label: Einleitung
          name: intro
          widget: text
      - label: FAQ
        name: faq
        widget: object
        fields:
        - label: Kleine Überschrift
          name: eyebrow
          widget: string
        - label: Hauptüberschrift
          name: title
          widget: string
    - label: Programmhinweis
      name: notice
      widget: text
    - label: Genuss-Karten
      name: culinaryItems
      widget: list
      fields:
      - label: Foto
        name: image
        widget: image
      - label: Titel
        name: title
        widget: string
      - label: Text
        name: text
        widget: text
        hint: Der vollständige Text, der auf der Website angezeigt wird.
    - label: Hotel
      name: hotel
      widget: object
      fields:
      - label: Kleine Überschrift
        name: eyebrow
        widget: string
      - label: Hotelname
        name: title
        widget: string
      - label: Hotelfoto
        name: image
        widget: image
      - label: Adresse
        name: address
        widget: text
      - label: Google-Maps-Link
        name: mapsUrl
        widget: string
      - label: Buttontext
        name: mapsButton
        widget: string
      - label: Hotel-Details
        name: details
        widget: list
        fields:
        - label: Icon
          name: icon
          widget: string
        - label: Titel
          name: title
          widget: string
        - label: Text
          name: text
          widget: string
    - label: Wetterorte
      name: weatherLocations
      widget: list
      fields:
      - label: Ort
        name: name
        widget: string
      - label: Breitengrad
        name: lat
        widget: number
        value_type: float
      - label: Längengrad
        name: lon
        widget: number
        value_type: float
    - label: Geschützter Schülerbereich
      name: studentArea
      widget: object
      fields:
      - label: Icon
        name: icon
        widget: string
      - label: Kleine Überschrift
        name: eyebrow
        widget: string
      - label: Titel
        name: title
        widget: string
      - label: Beschreibung
        name: text
        widget: text
      - label: Upload-Button
        name: uploadButton
        widget: string
      - label: Galerie-Button
        name: galleryButton
        widget: string
      - label: Hinweis
        name: note
        widget: text
      - label: Microsoft-Forms-Link
        name: uploadUrl
        widget: string
      - label: SharePoint-Galerie-Link
        name: galleryUrl
        widget: string
    - label: Admin-Hinweis
      name: adminArea
      widget: object
      fields:
      - label: Kleine Überschrift
        name: eyebrow
        widget: string
      - label: Titel
        name: title
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Buttontext
        name: button
        widget: string
    - label: Fußzeile
      name: footer
      widget: object
      fields:
      - label: Titel
        name: title
        widget: string
      - label: Untertitel
        name: subtitle
        widget: string
      - label: Versionsanzeige
        name: version
        widget: string
        required: false
      - label: Letzte Aktualisierung
        name: updated
        widget: string
        required: false
      - label: Nach-oben-Link
        name: topLink
        widget: string
      - label: Datenschutzhinweis
        name: privacy
        widget: string
- name: news
  label: News & Hinweise
  files:
  - name: news
    label: News & Hinweise
    file: content/news.json
    format: json
    fields:
    - label: Meldungen
      name: news
      widget: list
      label_singular: Meldung
      allow_add: true
      add_to_top: true
      collapsed: true
      minimize_collapsed: true
      hint: Mit „Meldung hinzufügen“ legst du einen neuen Beitrag an. Über den Griff links kannst du Beiträge verschieben; über das Papierkorb-Symbol löschst du sie.
      summary: '{{fields.date}} – {{fields.title}}'
      fields:
      - label: Überschrift
        name: title
        widget: string
        hint: Kurze, eindeutige Überschrift für die Meldung.
      - label: Datum
        name: date
        widget: datetime
        hint: Das Datum steuert die Anzeige und Sortierung der Meldung.
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY
        time_format: false
      - label: Text
        name: text
        widget: text
      - label: Wichtig hervorheben
        name: important
        widget: boolean
        default: false
        required: false
      - label: Veröffentlicht
        name: published
        widget: boolean
        default: true
- name: program
  label: Tagesprogramm
  files:
  - name: program
    label: Tagesprogramm
    file: content/program.json
    format: json
    fields:
    - label: Reisetage
      name: days
      widget: list
      summary: '{{fields.short}} {{fields.date}} – {{fields.title}}'
      fields:
      - label: Technische ID
        name: id
        widget: string
        hint: z. B. mo
      - label: Kurzname
        name: short
        widget: string
      - label: Datum
        name: date
        widget: string
      - label: Tagnummer
        name: dayNumber
        widget: number
        value_type: int
      - label: Titel
        name: title
        widget: string
      - label: Untertitel
        name: subtitle
        widget: text
      - label: Icon
        name: icon
        widget: string
        required: false
      - label: Titelbild
        name: cover
        widget: image
        required: false
      - label: Bilderreihe
        name: gallery
        widget: list
        required: false
        field:
          label: Bild
          name: image
          widget: image
      - label: Programmpunkte
        name: events
        widget: list
        summary: '{{fields.time}} – {{fields.title}}'
        fields:
        - label: Zeit
          name: time
          widget: string
        - label: Titel
          name: title
          widget: string
        - label: Beschreibung
          name: text
          widget: text
        - label: Status
          name: status
          widget: select
          options:
          - label: Normal
            value: ''
          - label: Bestätigt
            value: confirmed
          - label: Noch nicht bestätigt
            value: pending
          required: false
- name: gallery
  label: Öffentliche Galerie
  files:
  - name: gallery
    label: Öffentliche Galerie
    file: content/gallery.json
    format: json
    fields:
    - label: Fotos
      name: photos
      widget: list
      summary: '{{fields.day}} – {{fields.title}}'
      fields:
      - label: Titel
        name: title
        widget: string
      - label: Kategorie/Reisetag
        name: day
        widget: string
      - label: Bild
        name: image
        widget: image
        hint: Bild aus der Mediathek auswählen oder eine neue Datei hochladen. Empfohlen sind JPG oder WebP mit mindestens 1200 px Breite.
      - label: Alternativtext
        name: alt
        widget: string
        required: false
        hint: Kurze sachliche Bildbeschreibung für Barrierefreiheit. Bleibt das Feld leer, wird der Titel verwendet.
      - label: Beschreibung
        name: description
        widget: text
        required: false
      - label: Bildnachweis
        name: imageCredit
        widget: string
        required: false
        hint: "Bei eigenen Fotos z. B. Foto BS Rohrbach, bei fremden Bildern Quelle und Urheber angeben."
- name: places
  label: Karte & Orte
  files:
  - name: places
    label: Karte & Orte
    file: content/places.json
    format: json
    fields:
    - label: Orte
      name: places
      widget: list
      label_singular: Ort
      allow_add: true
      collapsed: true
      minimize_collapsed: true
      hint: Neue Orte mit „Ort hinzufügen“ anlegen. Die Reihenfolge lässt sich per Ziehen ändern.
      summary: '{{fields.category}} – {{fields.title}}'
      fields:
      - label: Name
        name: title
        widget: string
      - label: Kategorie
        name: category
        widget: select
        options:
        - label: "🏨 Hotel"
          value: Hotel
        - label: "🏛️ Sehenswürdigkeit"
          value: Sehenswürdigkeit
        - label: "🇪🇺 EU-Institution"
          value: EU
        - label: "💎 Antwerpen"
          value: Antwerpen
        - label: "⚔️ Waterloo"
          value: Waterloo
        - label: "🚇 Metro"
          value: Metro
        - label: "🍽️ Essen"
          value: Essen
        - label: "📌 Treffpunkt"
          value: Treffpunkt
        - label: "🚉 Bahnhof"
          value: Bahnhof
        - label: "🛍️ Einkauf"
          value: Einkauf
        - label: "🆘 Notfall"
          value: Notfall
        hint: Die Kategorie bestimmt Farbe und Symbol des Markers auf der Website.
      - label: Position auf der Karte
        name: coordinates
        widget: map-point
        hint: Auf die Karte klicken oder den Marker verschieben. Die Koordinaten werden automatisch gespeichert.
      - label: Adresse
        name: address
        widget: string
      - label: Gehzeit/Hinweis
        name: walk
        widget: string
      - label: Bild
        name: image
        widget: image
      - label: Beschreibung
        name: description
        widget: text
      - label: Google-Maps-Link
        name: maps
        widget: string
      - label: Bildnachweis
        name: imageCredit
        widget: string
        required: false
        hint: "z. B. Foto: © ÖV Brüssel / BMEIA"
- name: downloads
  label: Downloads
  files:
  - name: downloads
    label: Downloads
    file: content/downloads.json
    format: json
    fields:
    - label: Dokumente
      name: downloads
      widget: list
      label_singular: Dokument
      allow_add: true
      collapsed: true
      minimize_collapsed: true
      hint: Neue Dokumente kannst du mit „Dokument hinzufügen“ anlegen. Die Reihenfolge lässt sich per Ziehen verändern. Ein Dokument erscheint erst, wenn „Öffentlich anzeigen“ aktiviert ist.
      summary: '{{fields.title}}'
      fields:
      - label: Titel
        name: title
        widget: string
      - label: Beschreibung
        name: description
        widget: text
      - label: Datei
        name: file
        widget: file
        required: false
        hint: Datei auswählen oder hochladen. Ohne Datei bleibt der Eintrag unsichtbar bzw. nicht anklickbar.
      - label: Icon
        name: icon
        widget: string
        default: 📄
      - label: Öffentlich anzeigen
        name: published
        widget: boolean
        default: false
- name: faq
  label: FAQ
  files:
  - name: faq
    label: FAQ
    file: content/faq.json
    format: json
    fields:
    - label: Fragen
      name: items
      widget: list
      label_singular: Frage
      allow_add: true
      collapsed: true
      minimize_collapsed: true
      hint: Mit „Frage hinzufügen“ legst du einen neuen Eintrag an. Die Reihenfolge entspricht der Anzeige auf der Website und kann per Ziehen geändert werden.
      summary: '{{fields.question}}'
      fields:
      - label: Frage
        name: question
        widget: string
        hint: Formuliere die Frage möglichst kurz und verständlich.
      - label: Antwort
        name: answer
        widget: text
        hint: Die Antwort darf ausführlicher sein und wird im aufgeklappten FAQ-Bereich angezeigt.


- name: diary
  label: Reisetagebuch
  files:
  - name: diary
    label: Tagebucheinträge
    file: public/content/diary.json
    format: json
    fields:
    - label: Einträge
      name: entries
      widget: list
      label_singular: Tagebucheintrag
      allow_add: true
      collapsed: true
      minimize_collapsed: true
      summary: '{{fields.emoji}} {{fields.date}} – {{fields.title}}'
      hint: Schülerfotos zuerst sichten und nur freigegebene Bilder auswählen. Entwürfe bleiben auf der öffentlichen Website unsichtbar.
      fields:
      - label: Veröffentlichen
        name: published
        widget: boolean
        default: false
        hint: Erst aktivieren, wenn Text und Fotos vollständig geprüft sind.
      - label: Datum
        name: date
        widget: datetime
        date_format: DD.MM.YYYY
        time_format: false
        format: YYYY-MM-DD
      - label: Uhrzeit
        name: time
        widget: string
        required: false
        hint: Optional, z. B. 19:30 Uhr
      - label: Emoji
        name: emoji
        widget: string
        default: 📖
      - label: Titel
        name: title
        widget: string
      - label: Ort
        name: location
        widget: string
        required: false
      - label: Tagesbericht
        name: text
        widget: text
        hint: Kurzer redaktioneller Bericht; Zeilenumbrüche werden übernommen.
      - label: Titelbild
        name: cover
        widget: image
        required: false
      - label: Alternativtext zum Titelbild
        name: alt
        widget: string
        required: false
      - label: Weitere Fotos
        name: images
        widget: list
        required: false
        label_singular: Foto
        summary: '{{fields.alt}}'
        fields:
        - label: Foto
          name: image
          widget: image
        - label: Alternativtext
          name: alt
          widget: string
          required: false
        - label: Bildnachweis
          name: credit
          widget: string
          required: false
      - label: Schlagwörter
        name: tags
        widget: list
        required: false
        field:
          label: Schlagwort
          name: tag
          widget: string
      - label: Redaktion/Autor
        name: author
        widget: string
        required: false
        default: BS Rohrbach

- name: legal
  label: Rechtliches & Kontakt
  files:
  - name: legal
    label: Impressum, Datenschutz, Kontakt & Bildnachweise
    file: content/legal.json
    format: json
    fields:
    - label: Links in der Fußzeile
      name: footerLinks
      widget: list
      summary: '{{fields.label}}'
      fields:
      - label: Beschriftung
        name: label
        widget: string
      - label: Technischer Bereich
        name: panel
        widget: select
        options:
        - label: Impressum
          value: impressum
        - label: Datenschutz
          value: datenschutz
        - label: Kontakt
          value: kontakt
        - label: Bildnachweise
          value: bildnachweise
    - label: Impressum
      name: impressum
      widget: object
      fields: &legal_page_fields
      - label: Kleine Überschrift
        name: eyebrow
        widget: string
      - label: Titel
        name: title
        widget: string
      - label: Einleitung
        name: intro
        widget: text
      - label: Inhaltsblöcke
        name: blocks
        widget: list
        summary: '{{fields.heading}}'
        fields:
        - label: Überschrift
          name: heading
          widget: string
        - label: Absätze
          name: paragraphs
          widget: list
          field:
            label: Absatz
            name: paragraph
            widget: text
        - label: Links
          name: links
          widget: list
          required: false
          fields:
          - label: Beschriftung
            name: label
            widget: string
          - label: URL, E-Mail oder Telefonlink
            name: url
            widget: string
    - label: Datenschutz
      name: datenschutz
      widget: object
      fields: *legal_page_fields
    - label: Kontakt
      name: kontakt
      widget: object
      fields: *legal_page_fields
    - label: Bildnachweise
      name: bildnachweise
      widget: object
      fields: *legal_page_fields

