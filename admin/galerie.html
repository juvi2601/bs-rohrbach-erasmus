<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Galerie – BS Rohrbach Erasmus+</title><link rel="stylesheet" href="/admin/admin.css?v=13.7"><link rel="stylesheet" href="/admin/editor.css?v=13.7"><script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script></head><body>
<header class="topbar"><a class="brand" href="/admin/redaktion.html"><span class="brand-mark">E+</span><span><strong>BS Rohrbach Erasmus+</strong><small>Reise-Redaktion</small></span></a><div class="top-actions"><a class="button ghost" href="/admin/redaktion.html">Übersicht</a><a class="button ghost" href="/" target="_blank">Website ansehen</a></div></header>
<main class="editor-shell"><section class="editor-head"><p class="eyebrow">Brüssel 2026</p><h1>Galerie</h1><p>Öffentliche Reisemotive und Beschreibungen pflegen.</p></section><section class="editor-panel"><div class="section-heading"><div><p class="eyebrow">Öffentliche Motive</p><h2>Galerie verwalten</h2></div><button class="button primary" id="add">+ Motiv</button></div><div id="rows"></div><div class="editor-actions"><button class="button primary" id="save">Galerie speichern</button><span class="status" id="status">Wird geladen …</span></div></section></main>
<script src="/admin/editor-auth.js?v=13.7"></script><script>
let photos=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){rows.innerHTML=photos.map((x,i)=>`<article class="gallery-row" data-i="${i}"><img src="${esc(x.image)}" alt=""><div class="gallery-fields"><label>Titel<input data-k="title" value="${esc(x.title)}"></label><label>Kategorie<input data-k="day" value="${esc(x.day)}"></label><label class="wide">Bild-URL<input data-k="image" value="${esc(x.image)}"></label><label class="wide">Beschreibung<textarea data-k="description">${esc(x.description)}</textarea></label><label class="wide">Bildnachweis<input data-k="credit" value="${esc(x.credit||'')}"></label></div><button class="button danger" data-del="${i}">Löschen</button></article>`).join('');
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.del,1);render()});document.querySelectorAll('.gallery-row').forEach(card=>card.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>photos[+card.dataset.i][el.dataset.k]=el.value));}
async function load(){try{await EditorAuth.init();const d=await EditorAuth.api('/api/editor/gallery');photos=d.data.photos||[];render();status.textContent='Bereit.'}catch(e){status.textContent=e.message}}
add.onclick=()=>{photos.push({title:'',day:'Brüssel',image:'',description:'',credit:''});render()};save.onclick=async()=>{try{status.textContent='Speichert …';await EditorAuth.api('/api/editor/gallery',{method:'PUT',body:JSON.stringify({photos})});status.textContent='Gespeichert ✓'}catch(e){status.textContent=e.message}};load();
</script></body></html>
