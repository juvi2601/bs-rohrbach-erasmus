<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Galerie – BS Rohrbach Erasmus+</title><link rel="stylesheet" href="/admin/admin.css?v=13.7"><link rel="stylesheet" href="/admin/editor.css?v=13.7"><script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script><script src="/admin/admin-trip.js?v=15.0.3-dev"></script></head><body>
<header class="topbar"><a class="brand" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html"><span class="brand-mark">E+</span><span><strong>BS Rohrbach Erasmus+</strong><small>Reise-Redaktion</small></span></a><div class="top-actions"><a class="button ghost" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html">Übersicht</a><a class="button ghost" data-trip-website href="/" target="_blank">Website ansehen</a></div></header>
<main class="editor-shell"><section class="editor-head"><p class="eyebrow">Aktive Reise · <span data-trip-label>Reise wird geladen …</span></p><h1>Galerie</h1><p>Öffentliche Reisemotive und Beschreibungen pflegen.</p></section><section class="editor-panel"><div class="section-heading"><div><p class="eyebrow">Öffentliche Motive</p><h2>Galerie verwalten</h2></div><button class="button primary" id="add">+ Motiv</button></div><div id="rows"></div><div class="editor-actions"><button class="button primary" id="save">Galerie speichern</button><span class="status" id="status"></span></div></section></main>
<script>AdminTrip.apply().catch(console.error);</script><script src="/admin/editor-auth.js?v=15.0.3-dev"></script><script>
let photos=[],approvedMedia=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function picker(i,x){return `<div class="wide"><span class="field-title">Foto auswählen</span><p class="field-help">Nur bereits freigegebene Fotos dieser Reise.</p><div class="media-picker">${approvedMedia.filter(m=>m.mediaType==='image').map(m=>`<button type="button" class="media-choice ${x.image===m.image?'selected':''}" data-pick="${i}" data-url="${esc(m.image)}"><img src="${esc(m.image)}" alt=""><span>${esc(m.title||m.day||'Foto')}</span></button>`).join('')||'<p>Noch keine freigegebenen Fotos vorhanden.</p>'}</div></div>`}
function render(){rows.innerHTML=photos.map((x,i)=>`<article class="gallery-row" data-i="${i}">${x.image?`<img src="${esc(x.image)}" alt="">`:'<div class="empty-preview">Foto wählen</div>'}<div class="gallery-fields"><label>Titel<input data-k="title" value="${esc(x.title)}"></label><label>Kategorie<input data-k="day" value="${esc(x.day)}"></label>${picker(i,x)}<label class="wide">Beschreibung<textarea data-k="description">${esc(x.description)}</textarea></label><label class="wide">Bildnachweis<input data-k="credit" value="${esc(x.credit||'')}"></label></div><button class="button danger" data-del="${i}">Löschen</button></article>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.del,1);render()});document.querySelectorAll('.gallery-row').forEach(card=>card.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>photos[+card.dataset.i][el.dataset.k]=el.value));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pick,m=approvedMedia.find(x=>x.image===b.dataset.url);photos[i].image=b.dataset.url;if(m&&!photos[i].title)photos[i].title=m.title||'';if(m&&!photos[i].day)photos[i].day=m.day||EditorAuth.config?.destination||'Reise';render()})}
async function load(){try{await EditorAuth.init();const [d,m]=await Promise.all([EditorAuth.api('/api/editor/gallery'),fetch(`/api/media/gallery?trip=${encodeURIComponent(EditorAuth.trip)}`,{cache:'no-store'}).then(r=>r.ok?r.json():{items:[]})]);photos=d.data.photos||[];approvedMedia=m.items||[];render();status.textContent='Bereit.'}catch(e){status.textContent=e.message}}
add.onclick=()=>{photos.push({title:'',day:EditorAuth.config?.destination||'Reise',image:'',description:'',credit:''});render()};save.onclick=async()=>{const old=save.textContent;try{save.disabled=true;save.textContent='Wird gespeichert …';status.textContent='';await EditorAuth.api('/api/editor/gallery',{method:'PUT',body:JSON.stringify({photos})});const tm=new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});status.textContent=`✓ Änderungen gespeichert · ${tm} Uhr`}catch(e){status.textContent='✕ Speichern fehlgeschlagen: '+e.message}finally{save.disabled=false;save.textContent=old}};load();
</script></body></html>
