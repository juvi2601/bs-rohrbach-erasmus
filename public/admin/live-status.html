<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Live-Status – BS Rohrbach Erasmus+</title><link rel="stylesheet" href="/admin/admin.css?v=13.7"><link rel="stylesheet" href="/admin/editor.css?v=13.7"><script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script><script src="/admin/admin-trip.js?v=15.0.3-dev"></script></head><body>
<header class="topbar"><a class="brand" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html"><span class="brand-mark">E+</span><span><strong>BS Rohrbach Erasmus+</strong><small>Reise-Redaktion</small></span></a><div class="top-actions"><a class="button ghost" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html">Übersicht</a><a class="button ghost" data-trip-website href="/" target="_blank">Website ansehen</a></div></header>
<main class="editor-shell"><section class="editor-head"><p class="eyebrow">Aktive Reise · <span data-trip-label>Reise wird geladen …</span></p><h1>Live-Status</h1><p>Zeigt auf der Startseite kurz, was gerade passiert. Der Status kann automatisch aus dem Reiseprogramm übernommen oder manuell geändert werden.</p></section><section class="editor-panel"><div class="editor-form-grid">
<label class="wide">Steuerung <select id="mode"><option value="automatic">Automatisch aus dem Reiseprogramm</option><option value="manual">Manueller Live-Status</option></select></label>
<label>Darstellung <select id="type"><option value="info">Information (Blau)</option><option value="success">Alles in Ordnung (Grün)</option><option value="warning">Hinweis / Änderung (Gelb)</option><option value="important">Wichtige Information (Rot)</option></select></label>
<label>Emoji <select id="emoji"><option value="📖">📖 Allgemein</option><option value="🚌">🚌 Anreise / Bus</option><option value="🏨">🏨 Hotel</option><option value="🍽️">🍽️ Essen</option><option value="🏛️">🏛️ Besichtigung</option><option value="🇪🇺">🇪🇺 EU / Europa</option><option value="📸">📸 Erlebnis / Foto</option><option value="🎓">🎓 Bildung</option><option value="🚶">🚶 Unterwegs</option><option value="🎉">🎉 Highlight</option><option value="📢">📢 Meldung</option></select></label><label class="wide">Überschrift <input id="title"></label><label class="wide">Aktuelle Meldung <textarea id="text"></textarea></label></div><div class="editor-actions"><button class="button primary" id="save">Live-Status speichern</button><span class="status" id="status"></span></div></section></main>
<script>AdminTrip.apply().catch(console.error);</script><script src="/admin/editor-auth.js?v=15.0.3-dev"></script><script>
let current={};const manualFields=[type,emoji,title,text];function syncMode(){const manual=mode.value==='manual';manualFields.forEach(x=>{x.disabled=!manual;x.closest('label').classList.toggle('field-disabled',!manual)})}async function load(){try{await EditorAuth.init();const d=await EditorAuth.api('/api/editor/live');current=d.data.liveStatus||{};for(const k of ['mode','type','emoji','title','text'])document.getElementById(k).value=current[k]||'';syncMode();status.textContent='Bereit.'}catch(e){status.textContent=e.message}}mode.onchange=syncMode;save.onclick=async()=>{const old=save.textContent;try{save.disabled=true;save.textContent='Wird gespeichert …';status.textContent='';const liveStatus={mode:mode.value,type:type.value,emoji:emoji.value,title:title.value,text:text.value};await EditorAuth.api('/api/editor/live',{method:'PUT',body:JSON.stringify({liveStatus})});const tm=new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});status.textContent=`✓ Änderungen gespeichert · ${tm} Uhr`}catch(e){status.textContent='✕ Speichern fehlgeschlagen: '+e.message}finally{save.disabled=false;save.textContent=old}};load();
</script></body></html>
