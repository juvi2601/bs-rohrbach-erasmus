<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Live-Status – BS Rohrbach Erasmus+</title><link rel="stylesheet" href="/admin/admin.css?v=13.7"><link rel="stylesheet" href="/admin/editor.css?v=13.7"><script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script></head><body>
<header class="topbar"><a class="brand" href="/admin/redaktion.html"><span class="brand-mark">E+</span><span><strong>BS Rohrbach Erasmus+</strong><small>Reise-Redaktion</small></span></a><div class="top-actions"><a class="button ghost" href="/admin/redaktion.html">Übersicht</a><a class="button ghost" href="/" target="_blank">Website ansehen</a></div></header>
<main class="editor-shell"><section class="editor-head"><p class="eyebrow">Brüssel 2026</p><h1>Live-Status</h1><p>Aktuelle Meldung auf der Startseite über Microsoft-Rollen ändern.</p></section><section class="editor-panel"><div class="editor-form-grid">
<label>Steuerung <select id="mode"><option value="automatic">Automatisch aus Smart Journey</option><option value="manual">Manuellen Status verwenden</option></select></label>
<label>Manuellen Status anzeigen <input id="enabled" type="checkbox"></label>
<label>Darstellung <select id="type"><option value="info">Information (Blau)</option><option value="success">Alles in Ordnung (Grün)</option><option value="warning">Hinweis / Änderung (Gelb)</option><option value="important">Wichtige Information (Rot)</option></select></label>
<label>Emoji <input id="emoji" value="📢"></label><label class="wide">Überschrift <input id="title"></label><label class="wide">Aktuelle Meldung <textarea id="text"></textarea></label><label class="wide">Aktualisiert am / um <input id="updated" placeholder="z. B. 24.11.2026, 14:30 Uhr"></label></div><div class="editor-actions"><button class="button primary" id="save">Live-Status speichern</button><span class="status" id="status">Wird geladen …</span></div></section></main>
<script src="/admin/editor-auth.js?v=13.7"></script><script>
let current={};async function load(){try{await EditorAuth.init();const d=await EditorAuth.api('/api/editor/live');current=d.data.liveStatus||{};for(const k of ['mode','type','emoji','title','text','updated'])document.getElementById(k).value=current[k]||'';enabled.checked=!!current.enabled;status.textContent='Bereit.'}catch(e){status.textContent=e.message}}
save.onclick=async()=>{try{status.textContent='Speichert …';const liveStatus={mode:mode.value,enabled:enabled.checked,type:type.value,emoji:emoji.value,title:title.value,text:text.value,updated:updated.value||new Date().toLocaleString('de-AT')};await EditorAuth.api('/api/editor/live',{method:'PUT',body:JSON.stringify({liveStatus})});status.textContent='Gespeichert ✓'}catch(e){status.textContent=e.message}};load();
</script></body></html>
