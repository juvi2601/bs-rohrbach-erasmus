<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reisetagebuch – BS Rohrbach Erasmus+</title><link rel="stylesheet" href="/admin/admin.css?v=13.7"><link rel="stylesheet" href="/admin/editor.css?v=13.7"><script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script><script src="/admin/admin-trip.js?v=15.0.3-dev"></script></head><body>
<header class="topbar"><a class="brand" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html"><span class="brand-mark">E+</span><span><strong>BS Rohrbach Erasmus+</strong><small>Reise-Redaktion</small></span></a><div class="top-actions"><a class="button ghost" data-trip-link="/admin/redaktion.html" href="/admin/redaktion.html">Übersicht</a><a class="button ghost" data-trip-website href="/" target="_blank">Website ansehen</a></div></header>
<main class="editor-shell"><section class="editor-head"><p class="eyebrow">Aktive Reise · <span data-trip-label>Reise wird geladen …</span></p><h1>Reisetagebuch</h1><p>Tagesberichte erstellen, als Entwurf speichern oder veröffentlichen.</p></section><section class="editor-panel"><div class="section-heading"><div><p class="eyebrow">Einträge</p><h2>Reisetagebuch verwalten</h2></div><button class="button primary" id="add">+ Eintrag</button></div><div id="entries"></div><div class="editor-actions"><button class="button primary" id="save">Änderungen speichern</button><span class="status" id="status"></span></div></section></main>
<script>AdminTrip.apply().catch(console.error);</script><script src="/admin/editor-auth.js?v=15.0.3-dev"></script><script>
let entries=[],approvedMedia=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emojiOptions="<option value=\"📖\">📖 Allgemein</option><option value=\"🚌\">🚌 Anreise / Bus</option><option value=\"🏨\">🏨 Hotel</option><option value=\"🍽️\">🍽️ Essen</option><option value=\"🏛️\">🏛️ Besichtigung</option><option value=\"🇪🇺\">🇪🇺 EU / Europa</option><option value=\"📸\">📸 Erlebnis / Foto</option><option value=\"🎓\">🎓 Bildung</option><option value=\"🚶\">🚶 Unterwegs</option><option value=\"🎉\">🎉 Highlight</option>";
const dateOnly=v=>String(v||'').slice(0,10);
function suggestedDate(){const a=dateOnly(EditorAuth.config?.startDate),b=dateOnly(EditorAuth.config?.endDate),today=new Date().toISOString().slice(0,10);if(!a)return today;if(today<a)return a;if(b&&today>b)return b;return today}
function mediaPicker(e,i){const selected=(e.approvedPhotos||[])[0]||'';return `<div class="wide"><span class="field-title">Beitragsfoto (optional)</span><p class="field-help">Aus bereits freigegebenen Fotos dieser Reise auswählen.</p><div class="media-picker"><button type="button" class="media-choice ${!selected?'selected':''}" data-photo="" data-entry="${i}"><span>Ohne Foto</span></button>${approvedMedia.filter(m=>m.mediaType==='image').map(m=>`<button type="button" class="media-choice ${selected===m.image?'selected':''}" data-photo="${esc(m.image)}" data-entry="${i}"><img src="${esc(m.image)}" alt=""><span>${esc(m.title||m.day||'Foto')}</span></button>`).join('')}</div></div>`}
function render(){document.getElementById('entries').innerHTML=entries.map((e,i)=>`<article class="entry-card" data-i="${i}"><div class="entry-top"><h3>${esc(e.emoji||'📖')} ${esc(e.title||'Neuer Eintrag')}</h3><button class="button danger" data-del="${i}">Löschen</button></div><div class="editor-form-grid">
<label>Veröffentlichen <input type="checkbox" data-k="published" ${e.published?'checked':''}></label><label>Datum <input type="date" data-k="date" value="${esc(e.date)}" min="${esc(dateOnly(EditorAuth.config?.startDate))}" max="${esc(dateOnly(EditorAuth.config?.endDate))}"></label>
<label>Uhrzeit <input data-k="time" value="${esc(e.time)}" placeholder="z. B. 19:30 Uhr"></label><label>Emoji <select data-k="emoji">${emojiOptions}</select></label>
<label class="wide">Titel <input data-k="title" value="${esc(e.title)}"></label><label class="wide">Ort <input data-k="location" value="${esc(e.location)}"></label>
<label class="wide">Tagesbericht <textarea data-k="text">${esc(e.text)}</textarea></label>${mediaPicker(e,i)}<label class="wide">Schlagwörter (mit Komma trennen) <input data-k="tags" value="${esc((e.tags||[]).join(', '))}"></label>
<label class="wide">Redaktion/Autor <input data-k="author" value="${esc(e.author||'')}"></label></div></article>`).join('');
document.querySelectorAll('[data-k="emoji"]').forEach((el,i)=>el.value=entries[i]?.emoji||'📖');
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{entries.splice(+b.dataset.del,1);render()});document.querySelectorAll('.entry-card').forEach(card=>card.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.k==='tags')v=v.split(',').map(x=>x.trim()).filter(Boolean);entries[+card.dataset.i][el.dataset.k]=v;}));document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{entries[+b.dataset.entry].approvedPhotos=b.dataset.photo?[b.dataset.photo]:[];render()})}
async function load(){try{await EditorAuth.init();const [d,m]=await Promise.all([EditorAuth.api('/api/editor/diary'),fetch(`/api/media/gallery?trip=${encodeURIComponent(EditorAuth.trip)}`,{cache:'no-store'}).then(r=>r.ok?r.json():{items:[]})]);entries=d.data.entries||[];approvedMedia=m.items||[];render();status.textContent='Bereit.'}catch(e){status.textContent=e.message}}
add.onclick=()=>{entries.unshift({published:false,date:suggestedDate(),time:'',emoji:'📖',title:'',location:'',text:'',approvedPhotos:[],tags:[],author:EditorAuth.access?.name||'BS Rohrbach'});render()};
save.onclick=async()=>{const old=save.textContent;try{save.disabled=true;save.textContent='Wird gespeichert …';status.textContent='';await EditorAuth.api('/api/editor/diary',{method:'PUT',body:JSON.stringify({entries})});const tm=new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});status.textContent=`✓ Änderungen gespeichert · ${tm} Uhr`}catch(e){status.textContent='✕ Speichern fehlgeschlagen: '+e.message}finally{save.disabled=false;save.textContent=old}};load();
</script></body></html>
